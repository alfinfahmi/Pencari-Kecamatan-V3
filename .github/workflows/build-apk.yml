name: Build APK & iOS

# Jalankan otomatis setiap push ke branch main, ATAU dipicu manual lewat
# tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ==========================================
  # JOB 1: BUILD APK ANDROID (Linux Runner)
  # ==========================================
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (dibutuhkan Android Gradle build)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Python (untuk skrip enkripsi data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pycryptodome
        run: pip install pycryptodome

      - name: Generate folder platform Android & iOS (jika belum ada)
        # PENTING: folder ios/ WAJIB ada juga di sini meski job ini hanya
        # build APK -- flutter_launcher_icons dikonfigurasi untuk android+ios
        # sekaligus di pubspec.yaml, dan akan CRASH (bukan sekadar warning)
        # kalau salah satu folder platform itu tidak ada saat generate ikon.
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.lflirboyo .
          fi
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org com.lflirboyo .
          fi

      - name: Ganti nama aplikasi (label) di AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          import pathlib, re

          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if p.exists():
              text = p.read_text()
              print("--- SEBELUM ---")
              for line in text.splitlines():
                  if "android:label" in line:
                      print(line)
              text2 = re.sub(r'android:label="[^"]*"', 'android:label="Koordinat Kec. Tashil"', text, count=1)
              p.write_text(text2)
              print("--- SESUDAH ---")
              for line in text2.splitlines():
                  if "android:label" in line:
                      print(line)
          else:
              print("PERINGATAN: AndroidManifest.xml tidak ditemukan!")
          PYEOF

      - name: Paksa compileSdk seragam di SEMUA modul (app + plugin pihak ketiga)
        run: |
          python3 << 'PYEOF'
          import pathlib
          import re

          app_files = [
              pathlib.Path("android/app/build.gradle.kts"),
              pathlib.Path("android/app/build.gradle")
          ]

          for p in app_files:
              if not p.exists():
                  continue
              content = p.read_text()
              content, c1 = re.subn(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', content)
              if c1 == 0:
                  content, c2 = re.subn(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
              else:
                  c2 = 0

              if c1 > 0 or c2 > 0:
                  p.write_text(content)
                  print(f"Berhasil update compileSdk di aplikasi: {p}")
              elif "android {" in content:
                  content = content.replace("android {", "android {\n    compileSdk = 35")
                  p.write_text(content)
                  print(f"Berhasil menyisipkan compileSdk = 35 ke: {p}")

          KTS_BLOCK = '''
          // --- Ditambahkan otomatis oleh CI: paksa compileSdk seragam ke semua modul ---
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure(com.android.build.gradle.BaseExtension::class.java) {
                      compileSdkVersion(35)
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure(com.android.build.gradle.BaseExtension::class.java) {
                      compileSdkVersion(35)
                  }
              }
          }
          '''

          GROOVY_BLOCK = '''
          // --- Ditambahkan otomatis oleh CI: paksa compileSdk seragam ke semua modul ---
          subprojects {
              plugins.withId('com.android.application') {
                  android {
                      compileSdkVersion 35
                  }
              }
              plugins.withId('com.android.library') {
                  android {
                      compileSdkVersion 35
                  }
              }
          }
          '''

          root_candidates = [
              ("android/build.gradle.kts", KTS_BLOCK),
              ("android/build.gradle", GROOVY_BLOCK),
          ]

          MARKER = "Ditambahkan otomatis oleh CI"
          for path, block in root_candidates:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              text = p.read_text()
              if MARKER in text:
                  idx = text.find(MARKER)
                  line_start = text.rfind("\n// ---", 0, idx)
                  if line_start != -1:
                      text = text[:line_start].rstrip() + "\n"
              text = block + "\n\n" + text
              p.write_text(text)
              print(f"Berhasil menambahkan subprojects override ke: {path}")

          PYEOF

      - name: Ambil dependency
        run: flutter pub get

      - name: Generate ikon aplikasi & splash screen native
        run: |
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Generate Hive TypeAdapter (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Jalankan unit & widget test
        # Hanya dijalankan sekali di job ini (build-apk) -- test bersifat
        # platform-agnostic, tidak perlu diulang di job iOS/Web juga.
        run: |
          rm -f test/widget_test.dart
          flutter test

      - name: Enkripsi data_koordinat.json -> .enc
        run: python3 encrypt_data.py

      - name: Build APK (release)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pencari-kecamatan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ==========================================
  # JOB 2: BUILD IOS (macOS Runner)
  # ==========================================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pycryptodome
        run: pip install pycryptodome

      - name: Generate folder platform iOS & Android (jika belum ada)
        # PENTING: --org HARUS sama dengan job Android (com.lflirboyo), kalau
        # tidak, bundle identifier iOS & applicationId Android akan berbeda
        # tanpa sengaja (identitas aplikasi jadi tidak konsisten lintas platform).
        #
        # Folder android/ JUGA WAJIB ada di sini meski job ini hanya build
        # iOS -- flutter_launcher_icons dikonfigurasi android+ios sekaligus
        # di pubspec.yaml, dan CRASH kalau salah satu folder platform hilang.
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org com.lflirboyo .
          fi
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.lflirboyo .
          fi

      - name: Tambahkan izin lokasi ke Info.plist (wajib untuk geolocator & flutter_compass)
        # TANPA key ini, aplikasi iOS akan CRASH (bukan gagal build, tapi
        # crash saat dipakai pengguna) ketika fitur kompas kiblat atau
        # "Ambil dari GPS Perangkat" meminta izin lokasi.
        run: |
          python3 << 'PYEOF'
          import pathlib

          p = pathlib.Path("ios/Runner/Info.plist")
          text = p.read_text()

          KEY_BLOCK = (
              "\t<key>NSLocationWhenInUseUsageDescription</key>\n"
              "\t<string>Dipakai untuk kompas kiblat dan menambah titik koordinat dari lokasi Anda</string>\n"
          )

          if "NSLocationWhenInUseUsageDescription" in text:
              print("Info.plist: izin lokasi sudah ada, dilewati.")
          else:
              text = text.replace("<dict>", "<dict>\n" + KEY_BLOCK, 1)
              p.write_text(text)
              print("Info.plist: izin lokasi berhasil ditambahkan.")
          PYEOF

      - name: Ambil dependency
        run: flutter pub get

      - name: Generate ikon aplikasi & splash screen native
        run: |
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Generate Hive TypeAdapter (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Enkripsi data_koordinat.json -> .enc
        run: python3 encrypt_data.py

      - name: Build iOS (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Payload/Runner sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pencari-kecamatan-ios
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

  # ==========================================
  # JOB 3: BUILD & DEPLOY WEB (GitHub Pages)
  # ==========================================
  # Solusi praktis untuk pakai aplikasi ini di iPhone TANPA akun Apple
  # Developer berbayar: buka versi web-nya di Safari, lalu "Tambah ke
  # Layar Utama" -- berperilaku seperti aplikasi biasa (ikon sendiri,
  # tanpa address bar), meski secara teknis tetap web app (PWA).
  build-web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Generate folder platform Web, Android & iOS (jika belum ada)
        # Folder android/ & ios/ JUGA WAJIB ada meski job ini hanya build web
        # -- flutter_launcher_icons dikonfigurasi android+ios+web sekaligus
        # di pubspec.yaml, dan CRASH kalau folder android/ios hilang (web
        # sendiri kalau hilang cuma dapat warning, tapi android/ios FATAL).
        run: |
          if [ ! -d "web" ]; then
            flutter create --platforms=web --org com.lflirboyo .
          fi
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.lflirboyo .
          fi
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org com.lflirboyo .
          fi

      - name: Ganti judul & deskripsi halaman Web (index.html & manifest.json)
        # `flutter create --platforms=web` SELALU menulis ulang judul/deskripsi
        # generik ("pencari_kecamatan" / "A new Flutter project.") setiap kali
        # folder web/ digenerate ulang -- TIDAK membaca pubspec.yaml sama
        # sekali untuk ini. Tanpa patch ini, judul tab browser & preview link
        # (mis. saat di-share ke WhatsApp) akan selalu menampilkan teks
        # default itu, bukan nama/deskripsi aplikasi yang sebenarnya.
        run: |
          python3 << 'PYEOF'
          import pathlib, re, json

          p = pathlib.Path("web/index.html")
          if p.exists():
              text = p.read_text()
              text = re.sub(r'<title>[^<]*</title>', '<title>Koordinat Kec. Tashil</title>', text)
              text = re.sub(
                  r'<meta name="description" content="[^"]*">',
                  '<meta name="description" content="Pencarian koordinat presisi seluruh kecamatan Indonesia -- Lajnah Falakiyah Ma\'had \'Aly Lirboyo.">',
                  text,
              )
              text = re.sub(
                  r'<meta name="apple-mobile-web-app-title" content="[^"]*">',
                  '<meta name="apple-mobile-web-app-title" content="Koordinat Kec. Tashil">',
                  text,
              )
              p.write_text(text)
              print("web/index.html berhasil dipatch.")
          else:
              print("PERINGATAN: web/index.html tidak ditemukan!")

          p2 = pathlib.Path("web/manifest.json")
          if p2.exists():
              data = json.loads(p2.read_text())
              data["name"] = "Koordinat Kec. Tashil"
              data["short_name"] = "Koordinat Tashil"
              data["description"] = "Pencarian koordinat presisi seluruh kecamatan Indonesia -- Lajnah Falakiyah Ma'had 'Aly Lirboyo."
              data["background_color"] = "#0D5C3A"
              data["theme_color"] = "#0D5C3A"
              p2.write_text(json.dumps(data, indent=4))
              print("web/manifest.json berhasil dipatch.")
          else:
              print("PERINGATAN: web/manifest.json tidak ditemukan!")
          PYEOF

      - name: Ambil dependency
        run: flutter pub get

      - name: Generate ikon aplikasi (termasuk ikon web/PWA)
        run: flutter pub run flutter_launcher_icons

      - name: Generate Hive TypeAdapter (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Web (release)
        # --base-href WAJIB cocok dengan path GitHub Pages
        # (https://<user>.github.io/<nama-repo>/), diambil otomatis dari
        # nama repo supaya tidak perlu di-hardcode manual.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "Base href: /$REPO_NAME/"
          flutter build web --release --base-href "/$REPO_NAME/"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload hasil build web sebagai Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
